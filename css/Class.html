<html>
    <head>
        <!---Class selector-->>
        <style>
            .one{
                    background-color: yellowgreen;

            }
            .two{
                background-color: tomato;
                    margin:40px;
                    width:400px;
                    padding:20px;
                    text-align: center;
                    border: 4px solid blueviolet;
            }
            .three{
                text-align:justify;
                text-transform:uppercase;
                text-overflow: ellipsis;
                letter-spacing: 4px;
                line-height:3px;
                word-spacing:10px;
                text-shaddow:10px 10px purple;


            }
        </style>
    </head>
    <body>
        <p class="one"> This is a paragraph tag or element</p>
        <h2 class="two">This is a h2 header tag element</h2>
        <h3 class="three">This is a h3 header tag element</h3>
    </body>
</html>
